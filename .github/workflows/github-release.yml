name: GitHub release

on:
  workflow_call:
    inputs:
      runner-labels:
        description: "Runner labels (JSON array); a self-hosted runner needs gh"
        required: false
        type: string
        default: '["ubuntu-slim"]'

jobs:
  release:
    name: GitHub release
    runs-on: ${{ fromJSON(inputs.runner-labels) }}

    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Check tag matches the manifest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          contents="repos/$GITHUB_REPOSITORY/contents"
          raw="Accept: application/vnd.github.raw+json"
          if version=$(gh api -H "$raw" "$contents/package.json?ref=$GITHUB_REF_NAME" --jq .version 2>/dev/null); then
            manifest=package.json
          elif cargo=$(gh api -H "$raw" "$contents/Cargo.toml?ref=$GITHUB_REF_NAME" 2>/dev/null); then
            manifest=Cargo.toml
            version=$(grep -m1 '^version = ' <<<"$cargo" | cut -d'"' -f2)
          else
            echo "::error::Neither package.json nor Cargo.toml could be read at $GITHUB_REF_NAME."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $manifest version (v$version)."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ;;
          esac
