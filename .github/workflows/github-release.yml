name: GitHub release

on:
  workflow_call:
    inputs:
      runner-labels:
        description: "Runner labels (JSON array); a self-hosted runner needs gh"
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  release:
    name: GitHub release
    runs-on: ${{ fromJSON(inputs.runner-labels) }}

    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Check tag matches package.json version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected="v$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_REF_NAME" --jq .version)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ;;
          esac
