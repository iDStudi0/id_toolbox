name: Publish package

on:
  workflow_call:
    inputs:
      build:
        type: boolean
        default: true
      package-dir:
        type: string
        default: "."
      tag-prefix:
        type: string
        default: "v"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-slim

    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          expected="$TAG_PREFIX$(jq -r .version "$PACKAGE_DIR/package.json")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE_DIR/package.json version ($expected)."
            exit 1
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
          registries: |
            @idstudi0:https://npm.pkg.github.com/|$GITHUB_TOKEN

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Build
        if: ${{ inputs.build }}
        working-directory: ${{ inputs.package-dir }}
        run: bun run build

      - name: Publish to GitHub Packages
        working-directory: ${{ inputs.package-dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$(jq -r .version package.json)" in
            *-*) bun publish --tag next ;;
            *) bun publish ;;
          esac
