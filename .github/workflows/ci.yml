name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  workflows-lint:
    uses: ./.github/workflows/workflows-lint.yml
    permissions:
      contents: read
