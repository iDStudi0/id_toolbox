name: Workflows lint

on:
  workflow_call:
    inputs:
      private-repositories:
        description: Comma-separated private repositories of the owner that the workflows use actions from, read with the GitHub App token
        type: string
        default: ""
      app-client-id:
        description: GitHub App client ID, required with private-repositories
        type: string
        default: ""
    secrets:
      app-private-key:
        description: GitHub App private key, paired with app-client-id
        required: false

env:
  ACTIONLINT_VERSION: 1.17.1
  ZIZMOR_VERSION: 1.32.0
  GH_ACTIONS_LOCK_VERSION: 0.4.1

jobs:
  workflows-lint:
    name: Workflows lint
    runs-on: ubuntu-slim

    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mint an installation token
        id: app-token
        if: ${{ inputs.private-repositories != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repositories }}
          permission-contents: read

      - name: gh actions-lock
        if: ${{ hashFiles('.github/workflows/actions.lock') != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin "v${GH_ACTIONS_LOCK_VERSION}"
          gh actions-lock --verify

      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo kjanat/actionlint --pattern "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo kjanat/actionlint
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
          annotations: true
          version: ${{ env.ZIZMOR_VERSION }}
          token: ${{ steps.app-token.outputs.token || github.token }}
