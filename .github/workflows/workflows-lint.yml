name: Workflows lint

on:
  workflow_call:
    inputs:
      private-repositories:
        description: Comma-separated private repositories of the owner that the workflows use actions from, read with the GitHub App token
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID, required with private-repositories
        required: false
      app-private-key:
        description: GitHub App private key, paired with app-client-id
        required: false

env:
  ACTIONLINT_VERSION: 1.17.0
  ZIZMOR_VERSION: 1.31.1

jobs:
  workflows-lint:
    name: Workflows lint
    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint an installation token
        id: app-token
        if: ${{ inputs.private-repositories != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repositories }}
          permission-contents: read

      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo kjanat/actionlint --pattern "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" --repo kjanat/actionlint
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          version: ${{ env.ZIZMOR_VERSION }}
          token: ${{ steps.app-token.outputs.token || github.token }}
