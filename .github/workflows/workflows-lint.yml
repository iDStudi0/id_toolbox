name: Workflows lint

on:
  workflow_call:
    inputs:
      private-repositories:
        description: Comma-separated private repositories of the owner that the workflows use actions from, read with the GitHub App token
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID, required with private-repositories
        required: false
      app-private-key:
        description: GitHub App private key, paired with app-client-id
        required: false

jobs:
  workflows-lint:
    name: Workflows lint
    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mint an installation token
        id: app-token
        if: ${{ inputs.private-repositories != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repositories }}
          permission-contents: read

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: pipx run zizmor==1.30.1 --format=github .
