name: Bake & push

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID, used to check out the private submodules
        required: true
        type: string
      token-repositories:
        description: Repositories of the owner the App token reads (the project and its submodules), one per line
        required: true
        type: string
      bake-file:
        description: Bake file, which reads OWNER, TAG and BUN_VERSION from the environment
        type: string
        default: docker/docker-bake.hcl
      environment:
        description: Deployment environment of the build job
        type: string
        default: production
    secrets:
      app-private-key:
        description: GitHub App private key, paired with app-client-id
        required: true

jobs:
  build:
    name: Bake & push
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.token-repositories }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        env:
          BAKE_FILE: ${{ inputs.bake-file }}
          NPM_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          BUN_VERSION=$(cat .bun-version)
          export BUN_VERSION
          docker buildx bake --file "$BAKE_FILE" --push
          {
            echo "### Images — \`${TAG::7}\`"
            echo
            docker buildx bake --file "$BAKE_FILE" --print 2>/dev/null | jq -r '.target[].tags[] | "- `\(.)`"'
          } >> "$GITHUB_STEP_SUMMARY"
