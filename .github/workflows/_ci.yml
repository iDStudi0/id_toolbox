name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ !github.event.pull_request.draft }}
    uses: $/.github/workflows/checks.yml
    permissions:
      contents: read
      packages: read
