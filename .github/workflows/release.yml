name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      packages: read

  release:
    needs: checks
    uses: ./.github/workflows/github-release.yml
    permissions:
      contents: write
