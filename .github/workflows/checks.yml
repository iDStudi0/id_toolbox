name: Checks

on:
  workflow_call:
    inputs:
      quality:
        type: boolean
        default: true
      typecheck:
        type: boolean
        default: true
      test:
        type: boolean
        default: false
      build:
        type: boolean
        default: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Restore bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format
        if: ${{ !cancelled() && inputs.quality }}
        run: bun run quality

      - name: Typecheck
        if: ${{ !cancelled() && inputs.typecheck }}
        run: bun run typecheck

      - name: Test
        if: ${{ !cancelled() && inputs.test }}
        run: bun test

      - name: Build
        if: ${{ !cancelled() && inputs.build }}
        run: bun run build
